name: TestFlight Internal Testing

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Optional build number override (must exceed existing TestFlight builds)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  testflight:
    name: TestFlight Internal Only
    if: github.ref == 'refs/heads/master'
    runs-on: xcode-27
    timeout-minutes: 35
    environment: testflight
    concurrency:
      group: testflight-upload
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Prepare Xcode, web UI and configuration
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version
          printf 'SENTRY_DSN =\n' > AppConfig.xcconfig
          bash Scripts/fetch_view.sh
      - name: Sign, archive, and upload
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          DISTRIBUTION_P12_BASE64: ${{ secrets.DISTRIBUTION_P12_BASE64 }}
          DISTRIBUTION_P12_PASSWORD: ${{ secrets.DISTRIBUTION_P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: bash Scripts/ci_testflight.sh
      - name: Save distribution symbols and build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: testflight-diagnostics-${{ github.run_attempt }}
          path: |
            build/Archive.xcresult
            build/archive.log
            build/upload.log
            build/NightwavePlaza.xcarchive/dSYMs
          retention-days: 14
