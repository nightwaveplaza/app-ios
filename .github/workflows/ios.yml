name: iOS

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Upload to TestFlight Internal Only after simulator checks
        type: boolean
        default: false
      build_number:
        description: Optional build number override (must exceed existing TestFlight builds)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  simulator:
    name: Build and launch on iOS 27
    runs-on: xcode-27
    timeout-minutes: 35
    outputs:
      web_ui_artifact_id: ${{ steps.web_ui.outputs.artifact-id }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - name: Test simulator smoke script
        run: python3 -m unittest discover -s Scripts -p 'test_ci_simulator_smoke.py' -v
      - name: Prepare web UI and configuration
        run: |
          printf 'SENTRY_DSN =\n' > AppConfig.xcconfig
          bash Scripts/fetch_view.sh
          mkdir -p build/diagnostics
          ditto -c -k NightwavePlaza/WebApp build/web-ui.zip
          xcodebuild -version
      - name: Compile simulator app
        run: |
          set -o pipefail
          xcodebuild -project NightwavePlaza.xcodeproj -scheme NightwavePlaza \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData -resultBundlePath build/Simulator.xcresult \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= build 2>&1 | tee build/diagnostics/build.log
      - name: Launch on iPhone Duo and iPhone 18 Pro
        run: python3 Scripts/ci_simulator_smoke.py
      - name: Save tested web UI for signing job
        id: web_ui
        uses: actions/upload-artifact@v7
        with:
          name: tested-web-ui-${{ github.run_attempt }}
          path: build/web-ui.zip
          if-no-files-found: error
          retention-days: 7
      - name: Save simulator screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-diagnostics-${{ github.run_attempt }}
          path: |
            build/diagnostics
            build/Simulator.xcresult
          retention-days: 7

  testflight:
    name: TestFlight Internal Only
    if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight
    needs: simulator
    runs-on: xcode-27
    timeout-minutes: 35
    environment: testflight
    concurrency:
      group: testflight-upload
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.simulator.outputs.web_ui_artifact_id }}
          path: build
      - name: Restore the web UI tested in the simulator
        run: |
          ditto -x -k build/web-ui.zip NightwavePlaza/WebApp
          test -s NightwavePlaza/WebApp/index.html
          printf 'SENTRY_DSN =\n' > AppConfig.xcconfig
      - name: Sign, archive, and upload
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          DISTRIBUTION_P12_BASE64: ${{ secrets.DISTRIBUTION_P12_BASE64 }}
          DISTRIBUTION_P12_PASSWORD: ${{ secrets.DISTRIBUTION_P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: bash Scripts/ci_testflight.sh
      - name: Save distribution symbols and build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testflight-diagnostics-${{ github.run_attempt }}
          path: |
            build/Archive.xcresult
            build/archive.log
            build/upload.log
            build/NightwavePlaza.xcarchive/dSYMs
          retention-days: 14
